<!DOCTYPE html>
<html>

<head>

<title>Create Account - CricKart</title>

<link rel="stylesheet" href="homepage.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>



.signup-container{

display:flex;
justify-content:center;
align-items:center;
height:80vh;
background:#f8f8f8;

}

.signup-box{

background:white;
padding:40px;
width:380px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
text-align:center;

}

.signup-box h2{

margin-bottom:20px;

}

.signup-box input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;

}

.signup-box button{

width:100%;
padding:12px;
background:#ff6600;
border:none;
color:white;
font-size:16px;
font-weight:bold;
border-radius:5px;
cursor:pointer;

}

.signup-box button:hover{

background:#e65c00;

}

.signup-box a{

display:block;
margin-top:15px;
text-decoration:none;
color:#ff6600;

}

</style>

</head>


<body>



<header>

<div class="top-nav">

<div class="logo">

<img src="logo.png">

</div>


<div class="search-box">

<input type="text" placeholder="Search for products">

<button>SEARCH</button>

</div>


<div class="nav-icons">

<a href="#">Stores</a>

<a href="login.html">Log In</a>

<a href="#">Cart</a>

</div>

</div>


<div class="category-nav">

<a href="#">BATS</a>

<a href="#">BALLS</a>

<a href="#">GLOVES</a>

<a href="#">PADS</a>

<a href="#">SHOES</a>

<a href="#">HELMETS</a>

<a href="#">BAGS</a>

<a href="#">CLOTHING</a>

</div>

</header>



<div class="signup-container">

<div class="signup-box">

<h2>Create CricKart Account</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">CREATE ACCOUNT</button>

</form>

<a href="login.html">Already have account? Login</a>

</div>

</div>




<footer>

<p>© 2026 CricKart</p>

</footer>


</body>
</html>
