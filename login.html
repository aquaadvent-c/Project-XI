<!DOCTYPE html>
<html>

<head>

<title>CricKart Login</title>

<link rel="stylesheet" href="homepage.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* LOGIN PAGE ONLY CSS */

.login-container{

display:flex;
justify-content:center;
align-items:center;
height:80vh;
background:#f8f8f8;

}

.login-box{

background:white;
padding:40px;
width:350px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
text-align:center;

}

.login-box h2{

margin-bottom:20px;

}

.login-box input{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;

}

.login-box button{

width:100%;
padding:12px;
background:#ff6600;
border:none;
color:white;
font-size:16px;
font-weight:bold;
border-radius:5px;
cursor:pointer;

}

.login-box button:hover{

background:#e65c00;

}

.login-box a{

display:block;
margin-top:10px;
text-decoration:none;
color:#ff6600;

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header>

<div class="top-nav">

<div class="logo">

<img src="logo.png">

</div>


<div class="search-box">

<input type="text" placeholder="Search for products">

<button>SEARCH</button>

</div>


<div class="nav-icons">

<a href="#">Stores</a>

<a href="login.html">Log In</a>

<a href="#">Cart</a>

</div>

</div>



<div class="category-nav">

<a href="#">BATS</a>

<a href="#">BALLS</a>

<a href="#">GLOVES</a>

<a href="#">PADS</a>

<a href="#">SHOES</a>

<a href="#">HELMETS</a>

<a href="#">BAGS</a>

<a href="#">CLOTHING</a>

</div>

</header>


<!-- ================= LOGIN ================= -->

<div class="login-container">

<div class="login-box">

<h2>Login to CricKart</h2>

<form>

<input type="email" placeholder="Enter Email" required>

<input type="password" placeholder="Enter Password" required>

<button type="submit">LOGIN</button>

</form>

<a href="#">Forgot Password?</a>

<a href="createacc.html">Create Account</a>

</div>

</div>



<!-- ================= FOOTER ================= -->

<footer>

<p>© 2026 CricKart</p>

</footer>



</body>
</html>
